<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a0f1f" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f7f1e6" media="(prefers-color-scheme: light)" />
    <meta name="robots" content="noindex" />
    <title>Offline · Jalebi Games</title>
    <!-- Self-contained on purpose: this page is served from the service worker cache when there is no network, so it
         can only rely on itself (inline styles, inline logo, system fonts) plus /offline.js. Colours mirror the hub tokens
         in src/styles/hub.css (night = default, sandstone for a light OS scheme). -->
    <style>
      :root {
        --bg: #0a0f1f; --surface: #131a33; --line: rgba(150, 168, 255, 0.24);
        --text: #f3f5ff; --dim: #b0b9dc; --brand: #7b6dff; --brand-ink: #a79dff; --on-brand: #ffffff;
        --glow: rgba(123, 109, 255, 0.28);
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #f7f1e6; --surface: #fffaf0; --line: rgba(60, 50, 120, 0.2);
          --text: #1b2140; --dim: #4a5272; --brand: #5b4cf0; --brand-ink: #4a3bd6; --on-brand: #ffffff;
          --glow: rgba(91, 76, 240, 0.2);
        }
      }
      * { box-sizing: border-box; }
      html { background: var(--bg); }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
        color: var(--text);
        background: radial-gradient(900px 480px at 12% -10%, var(--glow), transparent 70%), var(--bg);
        font: 16px/1.6 'Plus Jakarta Sans Variable', 'Plus Jakarta Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      main { width: 100%; max-width: 26rem; padding: 32px 26px 28px; text-align: center; border: 1px solid var(--line); border-radius: 26px; background: var(--surface); box-shadow: 0 24px 60px -24px rgba(3, 6, 20, 0.6); }
      .mark { width: 72px; height: 72px; margin: 0 auto 18px; display: block; }
      .lights { display: flex; justify-content: center; gap: 12px; margin: 0 0 20px; }
      .lights i { width: 9px; height: 9px; border-radius: 50%; background: var(--brand); opacity: 0.35; animation: blink 1.6s ease-in-out infinite; }
      .lights i:nth-child(2) { animation-delay: 0.2s; } .lights i:nth-child(3) { animation-delay: 0.4s; } .lights i:nth-child(4) { animation-delay: 0.6s; } .lights i:nth-child(5) { animation-delay: 0.8s; }
      @keyframes blink { 50% { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .lights i { animation: none; opacity: 0.6; } }
      h1 { margin: 0 0 8px; font: 800 1.75rem/1.1 'Bricolage Grotesque Variable', 'Bricolage Grotesque', system-ui, sans-serif; letter-spacing: -0.03em; }
      p { margin: 0 0 22px; color: var(--dim); }
      a.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 48px; padding: 0 28px; border-radius: 999px; background: var(--brand); color: var(--on-brand); font-weight: 800; text-decoration: none; box-shadow: 0 8px 24px var(--glow); }
      a.btn:focus-visible { outline: 3px solid var(--brand-ink); outline-offset: 3px; }
      small { display: block; margin-top: 18px; color: var(--dim); font-size: 0.8125rem; }
    </style>
  </head>
  <body>
    <main role="main">
      <span class="mark" aria-hidden="true"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="ghf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#e7defe"></stop></linearGradient><radialGradient id="ghc" cx=".38" cy=".3" r=".8"><stop offset="0" stop-color="#6b55ff"></stop><stop offset="1" stop-color="#2a1f78"></stop></radialGradient></defs><g transform="translate(0 -1.6) rotate(-8 32 32)"><rect x="7" y="12" width="50" height="50" rx="15" fill="#3b2a9a" stroke="#2a1f78" stroke-width="2"></rect><rect x="7" y="6" width="50" height="50" rx="15" fill="url(#ghf)" stroke="#2a1f78" stroke-width="2"></rect><path d="M13 18.5A9 9 0 0 1 21 11.4" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" opacity=".9"></path><g stroke="#cdbffa" stroke-width="3.6" stroke-linecap="round"><path d="M32 31L20 19"></path><path d="M32 31L44 19"></path><path d="M32 31L20 43"></path><path d="M32 31L44 43"></path></g><g><circle cx="20.6" cy="20.3" r="5" fill="#2a1f78" opacity=".28"></circle><circle cx="20" cy="19" r="4.9" fill="#ff4d6d"></circle><circle cx="18.6" cy="17.5" r="1.5" fill="#fff" opacity=".7"></circle></g><g><circle cx="44.6" cy="20.3" r="5" fill="#2a1f78" opacity=".28"></circle><circle cx="44" cy="19" r="4.9" fill="#ffd23f"></circle><circle cx="42.6" cy="17.5" r="1.5" fill="#fff" opacity=".7"></circle></g><g><circle cx="20.6" cy="44.3" r="5" fill="#2a1f78" opacity=".28"></circle><circle cx="20" cy="43" r="4.9" fill="#3ddc97"></circle><circle cx="18.6" cy="41.5" r="1.5" fill="#fff" opacity=".7"></circle></g><g><circle cx="44.6" cy="44.3" r="5" fill="#2a1f78" opacity=".28"></circle><circle cx="44" cy="43" r="4.9" fill="#4cc9f0"></circle><circle cx="42.6" cy="41.5" r="1.5" fill="#fff" opacity=".7"></circle></g><circle cx="32" cy="32.2" r="7.4" fill="#2a1f78" opacity=".25"></circle><circle cx="32" cy="31" r="6.8" fill="url(#ghc)"></circle><circle cx="32" cy="31" r="2.7" fill="#ffc857"></circle><circle cx="31.2" cy="30.2" r="1" fill="#fff6d6"></circle></g></svg></span>
      <div class="lights" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <h1>You are offline</h1>
      <p>Every game on Jalebi Games is played live with other people, so you need an internet connection. Check your Wi-Fi or mobile data and try again.</p>
      <a class="btn" href="/">Try again</a>
      <small id="status" role="status">Waiting for your connection&hellip; the page reloads by itself when you are back online.</small>
    </main>
    <script src="/offline.js"></script>
  </body>
</html>
