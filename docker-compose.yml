# Local staging database: Postgres plus Neon's HTTP proxy, so the Worker's Neon HTTP driver
# (@neondatabase/serverless) talks to it exactly as it talks to Neon in production.
#
#   docker compose up -d          start (data persists in the `pgdata` volume)
#   npm run migrate:staging       create the tables
#   npm run worker:staging        Worker on :8787 using .dev.vars.staging
#   docker compose down -v        stop and wipe the data
#
# The driver is pointed at the proxy for localhost URLs in worker/neonLocal.js.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gamehub
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d gamehub']
      interval: 2s
      timeout: 3s
      retries: 30

  neon-proxy:
    image: ghcr.io/timowilhelm/local-neon-http-proxy:main
    environment:
      PG_CONNECTION_STRING: postgres://postgres:postgres@postgres:5432/gamehub
    ports:
      - '4444:4444'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
